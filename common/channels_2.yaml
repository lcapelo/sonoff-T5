# Variante de 2 canales.

switch:
  - platform: gpio
    id: relay_1
    name: "${channel_1}"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_2
    name: "${channel_2}"
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: template
    id: touchfield_1
    name: "Boton ${channel_1}"
  - platform: template
    id: touchfield_2
    name: "Boton ${channel_2}"

  - platform: template
    id: long_press_1
    name: "Long ${channel_1}"
  - platform: template
    id: long_press_2
    name: "Long ${channel_2}"

script:
  # Cancela el long-press pendiente/activo cuando el gesto termina siendo un
  # swipe, un multi-touch, o el long-press GLOBAL (5s) del componente -- estos
  # 4 eventos NUNCA disparan on_release (el propio componente los desvia por
  # su cuenta), asi que sin esto long_press_watch sigue corriendo y termina
  # prendiendo el long_press_N del canal donde arranco el toque. Tambien
  # limpia el flash de touch/long-press que pudiera seguir activo.
  - id: cancel_long_press
    mode: restart
    then:
      - script.stop: long_press_watch
      - script.stop: touch_flash_timeout
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - script.execute: restore_ambient_state
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - globals.set:
                id: long_press_fired
                value: "false"
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_2
                state: OFF
          else:
            - globals.set:
                id: long_press_fired
                value: "false"

  # touch.x va de 1 a 10; con 2 botones el corte queda en la mitad (pos<=5).
  - id: led_on_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - if:
                condition:
                  lambda: "return id(touch_pos) <= 5;"
                then:
                  - globals.set:
                      id: flash_led_from
                      value: !lambda "return 0;"
                  - globals.set:
                      id: flash_led_to
                      value: !lambda "return 3;"
                  - globals.set:
                      id: flash_led_from2
                      value: !lambda "return 20;"
                  - globals.set:
                      id: flash_led_to2
                      value: !lambda "return 31;"
                else:
                  - globals.set:
                      id: flash_led_from
                      value: !lambda "return 4;"
                  - globals.set:
                      id: flash_led_to
                      value: !lambda "return 19;"
                  - globals.set:
                      id: flash_led_from2
                      value: !lambda "return -1;"
            - globals.set:
                id: flash_use_long_press_color
                value: "false"
            - script.execute: save_ambient_state
            - light.turn_on:
                id: rgb_light
                effect: "None"
            - light.turn_on:
                id: rgb_light
                effect: "Segment Flash"
            - script.execute: touch_flash_timeout

  - id: long_press_watch
    mode: restart
    then:
      - delay: ${long_press_time}
      - globals.set:
          id: long_press_fired
          value: "true"
      - if:
          condition:
            lambda: "return id(touch_pos) <= 5;"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: ON
          else:
            - binary_sensor.template.publish:
                id: long_press_2
                state: ON
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - script.stop: touch_flash_timeout
            - globals.set:
                id: flash_use_long_press_color
                value: "true"
      - switch.turn_on: vibra

  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_2
                state: OFF
            - if:
                condition:
                  lambda: "return ${visual_feedback};"
                then:
                  - script.execute: restore_ambient_state
          else:
            - if:
                condition:
                  lambda: "return pos <= 5;"
                then:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_1_on_touch};"
                      then:
                        - switch.toggle: relay_1
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: OFF
                else:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_2_on_touch};"
                      then:
                        - switch.toggle: relay_2
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: OFF
