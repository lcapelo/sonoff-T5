# Variante de 2 canales.
# NOTA: no hay hardware de 2 canales para calibrar los LEDs; se divide la tira
# de 32 en dos mitades (0-15 / 16-31) como default razonable. Ajusta si tu
# unidad fisica ilumina otras zonas para cada boton.

switch:
  - platform: gpio
    id: relay_1
    name: "${channel_1}"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_led_default
    on_turn_off:
      - script.execute: refresh_led_default

  - platform: gpio
    id: relay_2
    name: "${channel_2}"
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_led_default
    on_turn_off:
      - script.execute: refresh_led_default

binary_sensor:
  - platform: template
    id: touchfield_1
    name: "Boton ${channel_1}"
  - platform: template
    id: touchfield_2
    name: "Boton ${channel_2}"

  - platform: template
    id: long_press_1
    name: "Long ${channel_1}"
  - platform: template
    id: long_press_2
    name: "Long ${channel_2}"

light:
  - platform: partition
    id: light_channel_1
    name: "Led ${channel_1}"
    segments:
      - id: rgb_light
        from: 0
        to: 15

  - platform: partition
    id: light_channel_2
    name: "Led ${channel_2}"
    segments:
      - id: rgb_light
        from: 16
        to: 31

script:
  # touch.x va de 1 a 10; con 2 botones el corte queda en la mitad (pos<=5).
  - id: long_press_watch
    mode: restart
    then:
      - delay: ${long_press_time}
      - globals.set:
          id: long_press_fired
          value: "true"
      - if:
          condition:
            lambda: "return id(touch_pos) <= 5;"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: ON
            - light.turn_on:
                id: light_channel_1
                brightness: ${long_press_brightness}
                red: !lambda "return id(long_press_color)[0]/100.0;"
                green: !lambda "return id(long_press_color)[1]/100.0;"
                blue: !lambda "return id(long_press_color)[2]/100.0;"
          else:
            - binary_sensor.template.publish:
                id: long_press_2
                state: ON
            - light.turn_on:
                id: light_channel_2
                brightness: ${long_press_brightness}
                red: !lambda "return id(long_press_color)[0]/100.0;"
                green: !lambda "return id(long_press_color)[1]/100.0;"
                blue: !lambda "return id(long_press_color)[2]/100.0;"
      - switch.turn_on: vibra

  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_2
                state: OFF
            - script.execute: refresh_led_default
          else:
            - if:
                condition:
                  lambda: "return pos <= 5;"
                then:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_1_on_touch};"
                      then:
                        - switch.toggle: relay_1
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: OFF
                else:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_2_on_touch};"
                      then:
                        - switch.toggle: relay_2
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: OFF

  - id: refresh_led_default
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(relay_1).state;"
          then:
            - light.turn_on:
                id: light_channel_1
                brightness: ${button_brightness}
                red: !lambda "return id(button_color)[0]/100.0;"
                green: !lambda "return id(button_color)[1]/100.0;"
                blue: !lambda "return id(button_color)[2]/100.0;"
          else:
            - if:
                condition:
                  lambda: "return id(nightlight).state || id(nightlight_active).state;"
                then:
                  - light.turn_on:
                      id: light_channel_1
                      brightness: ${nightlight_brightness}
                      red: !lambda "return id(nightlight_color)[0]/100.0;"
                      green: !lambda "return id(nightlight_color)[1]/100.0;"
                      blue: !lambda "return id(nightlight_color)[2]/100.0;"
                else:
                  - light.turn_off: light_channel_1

      - if:
          condition:
            lambda: "return id(relay_2).state;"
          then:
            - light.turn_on:
                id: light_channel_2
                brightness: ${button_brightness}
                red: !lambda "return id(button_color)[0]/100.0;"
                green: !lambda "return id(button_color)[1]/100.0;"
                blue: !lambda "return id(button_color)[2]/100.0;"
          else:
            - if:
                condition:
                  lambda: "return id(nightlight).state || id(nightlight_active).state;"
                then:
                  - light.turn_on:
                      id: light_channel_2
                      brightness: ${nightlight_brightness}
                      red: !lambda "return id(nightlight_color)[0]/100.0;"
                      green: !lambda "return id(nightlight_color)[1]/100.0;"
                      blue: !lambda "return id(nightlight_color)[2]/100.0;"
                else:
                  - light.turn_off: light_channel_2
