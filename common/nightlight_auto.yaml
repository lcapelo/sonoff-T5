# Extension OPCIONAL, ACTUALMENTE SIN EFECTO: automatizaba el switch interno
# "nightlight" segun la posicion del sol, pero ese switch (y "nightlight_active",
# y el indicador LED por canal que pintaban) se eliminaron al rediseñar el
# feedback de LEDs -- ahora Luz Ambiente es la unica duena de los 32 LEDs, sin
# ningun indicador persistente de estado por canal al cual "apagar a
# nightlight_color". Si se quiere recuperar un modo nocturno automatico hay
# que decidir a que aplica ahora (por ejemplo, atenuar "Luz Ambiente"
# directamente al anochecer) y escribir ese script desde cero. Por ahora esta
# extension solo deja declarados time/sun, listos para reusar.

substitutions:
  latitude: "0.000000°"
  longitude: "0.000000°"

time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp
    id: sntp_time

sun:
  latitude: ${latitude}
  longitude: ${longitude}
