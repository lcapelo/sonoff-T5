# Orientacion vertical (panel mas alto que ancho - montaje de hoy).
# Los sensores de swipe se nombran segun el eje vertical (arriba/abajo), ya
# que un swipe nativo del panel (izquierda/derecha) se percibe como un gesto
# arriba/abajo cuando el panel esta montado en vertical.
substitutions:
  swipe_a_name: "Swipe Top"
  swipe_b_name: "Swipe Bottom"
