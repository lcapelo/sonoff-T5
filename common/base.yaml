# Paquete comun a todas las variantes (1-4 canales) del Sonoff T5 US.
# No define reles, touchfields ni particiones de canal: eso vive en channels_N.yaml.
#
# GPIOs: son los del hardware real del usuario (T5 US, tira ambiente de 32 LEDs en
# GPIO33). NO son los defaults del proyecto sonoff-tx-ultimate-for-esphome (28 LEDs,
# GPIO13) - ver README.md.

substitutions:
  name: "sonoff-t5"
  friendly_name: "Sonoff T5"
  ip: "XX.XX.XX.XX"

  relay_count: "3"

  brightness_on: "40%"
  brightness_nightlight: "0%"

  vibra_time: 100ms
  button_on_time: 500ms
  long_press_time: 500ms

  button_brightness: "0.7"
  button_color: "{0,0,100}"

  nightlight_brightness: "0.2"
  nightlight_color: "{80,70,0}"

  touch_brightness: "0"
  touch_color: "{0,100,0}"
  touch_effect: "None"

  long_press_brightness: "1"
  long_press_color: "{100,0,0}"

  multi_touch_brightness: "1"
  multi_touch_color: "{0,0,0}"
  multi_touch_effect: "None"

  swipe_left_brightness: "1"
  swipe_left_color: "{0,100,0}" #verde

  swipe_right_brightness: "1"
  swipe_right_color: "{100,0,70}" # rosita

  # Reles (GPIO18/17/27 = los 3 usados hoy; GPIO23 = 4to rele, sin confirmar en hardware real)
  relay_1_pin: GPIO18
  relay_2_pin: GPIO17
  relay_3_pin: GPIO27
  relay_4_pin: GPIO23

  vibra_motor_pin: GPIO21
  touchpanel_power_pin: GPIO5

  # Tira "Luz Ambiente" (32 LEDs direccionables, usada tambien como indicador por canal)
  ambient_led_pin: GPIO33
  ambient_led_count: "32"
  # LED interno pequeno (no direccionable a nivel de canal, solo decorativo/status)
  status_led_pin: GPIO13

  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22

  audio_bclk_pin: GPIO2
  audio_lrclk_pin: GPIO4
  audio_sdata_pin: GPIO15
  audio_mute_pin: GPIO26

  # Desacople toque -> rele por canal. "false" = el panel solo avisa a HA, no conmuta el rele.
  toggle_relay_1_on_touch: "true"
  toggle_relay_2_on_touch: "true"
  toggle_relay_3_on_touch: "true"
  toggle_relay_4_on_touch: "true"

  # Orientacion de montaje: "vertical" (panel mas alto que ancho, como esta hoy)
  # u "horizontal" (rotado 90 grados). Selecciona common/orientation_${orientation}.yaml
  # desde sonoff-t5.yaml, que sobreescribe los *_name de abajo.
  orientation: "vertical"
  led_top_name: "Led Arriba"
  led_bottom_name: "Led Abajo"
  led_left_name: "Led Izquierda"
  led_right_name: "Led Derecha"
  swipe_a_name: "Swipe Top"
  swipe_b_name: "Swipe Bottom"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100.0
    then:
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF
      - binary_sensor.template.publish:
          id: long_press
          state: OFF
      - script.execute: refresh_led_default
      # El script refresh_nightlight (si esta importado, ver
      # common/nightlight_auto.yaml) agrega su propia entrada de on_boot.

esp32:
  board: esp32dev
  framework:
    type: arduino #esp-idf 

# Copia vendorizada en components/tx_ultimate_touch (ver ese folder para el
# origen/licencia). Se usa "local" en vez de "git" para no depender de que el
# repo de SmartHome-yourself no cambie/desaparezca.
external_components:
  - source: github://lcapelo/sonoff-T5@refactor_component
    #   type: local
    #   path: config/components

logger:
#  level: DEBUG

api:
#  encryption:
#    key: "xxxx"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret wifi_ap_password

  use_address: ${ip}

# esp32_ble_tracker / bluetooth_proxy / web_server son opcionales y viven en
# common/ble_tracker.yaml, bluetooth_proxy.yaml, web_server.yaml. Se habilitan
# importandolos (o no) desde el packages: de sonoff-t5.yaml.

uart:
  id: my_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 115200

globals:
  - id: touch_pos
    type: int
    restore_value: no
    initial_value: "-1"
  - id: long_press_fired
    type: bool
    restore_value: no
    initial_value: "false"

  - id: button_color
    type: int[3]
    restore_value: no
    initial_value: ${button_color}
  - id: nightlight_color
    type: int[3]
    restore_value: no
    initial_value: ${nightlight_color}
  - id: touch_color
    type: int[3]
    restore_value: no
    initial_value: ${touch_color}
  - id: long_press_color
    type: int[3]
    restore_value: no
    initial_value: ${long_press_color}
  - id: multi_touch_color
    type: int[3]
    restore_value: no
    initial_value: ${multi_touch_color}
  - id: swipe_left_color
    type: int[3]
    restore_value: no
    initial_value: ${swipe_left_color}
  - id: swipe_right_color
    type: int[3]
    restore_value: no
    initial_value: ${swipe_right_color}

tx_ultimate_touch:
  id: tx_touch
  uart: my_uart

  on_press:
    - globals.set:
        id: touch_pos
        value: !lambda "return touch.x;"
    - globals.set:
        id: long_press_fired
        value: "false"
    - script.execute: led_on_touch
    - script.execute: long_press_watch
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_press", "Touch Position: %d / State: %d", touch.x, touch.state);

  on_release:
    - script.stop: long_press_watch
    - script.execute:
        id: handle_release
        pos: !lambda "return touch.x;"
    - switch.turn_on: vibra
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_release", "Release Position: %d / State: %d", touch.x, touch.state);

  on_swipe_left:
    # cancel_long_press PRIMERO: este evento nunca pasa por on_release, asi
    # que hay que cortar/limpiar el long_press_watch pendiente/activo aca.
    - script.execute: cancel_long_press
    - script.execute: led_on_swipe_left
    - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: swipe_left
        state: ON
    - delay: ${button_on_time}
    - binary_sensor.template.publish:
        id: swipe_left
        state: OFF

  on_swipe_right:
    - script.execute: cancel_long_press
    - script.execute: led_on_swipe_right
    - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: swipe_right
        state: ON
    - delay: ${button_on_time}
    - binary_sensor.template.publish:
        id: swipe_right
        state: OFF

  on_full_touch_release:
    - script.execute: cancel_long_press
    - script.execute: led_on_full_touch
    - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: multi_touch
        state: ON
    - delay: ${button_on_time}
    - binary_sensor.template.publish:
        id: multi_touch
        state: OFF

  on_long_touch_release:
    # Long-press GLOBAL del propio componente (5s, no distingue canal).
    # El long-press POR BOTON configurable (${long_press_time}) vive en channels_N.yaml.
    # Tampoco pasa por on_release, asi que igual hay que limpiar aca.
    - script.execute: cancel_long_press
    - script.execute: led_on_long_touch
    - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: long_press
        state: ON
    - delay: ${button_on_time}
    - binary_sensor.template.publish:
        id: long_press
        state: OFF

binary_sensor:
  - platform: template
    id: swipe_left
    name: "${swipe_a_name}"
  - platform: template
    id: swipe_right
    name: "${swipe_b_name}"
  - platform: template
    id: multi_touch
    name: "Multi touch"
  - platform: template
    id: long_press
    name: "Long press (5s)"

switch:
  - platform: gpio
    id: vibra
    name: "${friendly_name} Vibration"
    pin: ${vibra_motor_pin}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${vibra_time}
      - switch.turn_off: vibra

  - platform: gpio
    id: touch_power
    name: "touch panel power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
    internal: true
    restore_mode: ALWAYS_ON

  - platform: template
    id: nightlight
    name: "Nightlight (auto)"
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_led_default
    on_turn_off:
      - script.execute: refresh_led_default

  - platform: template
    id: nightlight_active
    name: "Nightlight"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: refresh_led_default
    on_turn_off:
      - script.execute: refresh_led_default

  - platform: restart
    name: "${friendly_name} Restart"

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: ${status_led_pin}
    num_leds: 1
    name: "NeoPixel 13"
    internal: true

  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: ${ambient_led_pin}
    num_leds: ${ambient_led_count}
    name: "Luz Ambiente"
    id: rgb_light
    effects:
      - addressable_rainbow:
          name: "rainbow fast"
          speed: 50
      - pulse:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: "Slow Pulse"
          update_interval: 2s
      - addressable_scan:
      - addressable_scan:
          name: Scan Effect With Custom Values
          move_interval: 100ms
          scan_width: 3
      - addressable_twinkle:
      - addressable_twinkle:
          name: Twinkle Effect With Custom Values
          twinkle_probability: 5%
          progress_interval: 4ms
      - addressable_random_twinkle:
      - addressable_random_twinkle:
          name: Random Twinkle Effect With Custom Values
          twinkle_probability: 20%
          progress_interval: 32ms
      - addressable_fireworks:
      - addressable_fireworks:
          name: Fireworks Effect With Custom Values
          update_interval: 32ms
          spark_probability: 10%
          use_random_color: false
          fade_out_rate: 120
      - addressable_flicker:
      - addressable_flicker:
          name: Flicker Effect With Custom Values
          update_interval: 16ms
          intensity: 5%

  # Los 4 lados del anillo de 32 LEDs, compartidos por TODAS las variantes
  # (1-4 canales). Layout real del T5 US (visto de frente):
  #   ---30-29-28-27-26-25---
  #   31---------------------24
  #   0----------------------23
  #   1----------------------22
  #   ........................
  #   8----------------------15
  #   ----9-10-11-12-13-14----
  - platform: partition
    id: light_top
    name: "${led_top_name}"
    segments:
      - id: rgb_light
        from: 25
        to: 30

  - platform: partition
    id: light_bottom
    name: "${led_bottom_name}"
    segments:
      - id: rgb_light
        from: 9
        to: 14

  - platform: partition
    id: light_right
    name: "${led_right_name}"
    segments:
      - id: rgb_light
        from: 0
        to: 8
      - id: rgb_light
        from: 31
        to: 31

  - platform: partition
    id: light_left
    name: "${led_left_name}"
    segments:
      - id: rgb_light
        from: 15
        to: 24

i2s_audio:
  id: audio_i2s
  i2s_bclk_pin: ${audio_bclk_pin}
  i2s_lrclk_pin: ${audio_lrclk_pin}

speaker:
  - platform: i2s_audio
    id: audio_speaker
    i2s_audio_id: audio_i2s
    i2s_dout_pin: ${audio_sdata_pin}
    dac_type: external
    i2s_mode: primary
    i2s_comm_fmt: i2s_lsb

media_player:
  - platform: speaker
    id: media_out
    name: "Speaker"
    announcement_pipeline:
      speaker: audio_speaker


script:
  # Enciende/apaga la tira completa como aviso transitorio de gesto, y luego
  # restaura el estado normal (reles + nightlight) via refresh_led_default.
  - id: led_on_touch
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          brightness: ${touch_brightness}
          red: !lambda "return id(touch_color)[0]/100.0;"
          green: !lambda "return id(touch_color)[1]/100.0;"
          blue: !lambda "return id(touch_color)[2]/100.0;"
          effect: ${touch_effect}
      - delay: 1s
      - script.execute: refresh_led_default

  - id: led_on_swipe_left
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          brightness: ${swipe_left_brightness}
          red: !lambda "return id(swipe_left_color)[0]/100.0;"
          green: !lambda "return id(swipe_left_color)[1]/100.0;"
          blue: !lambda "return id(swipe_left_color)[2]/100.0;"
      - delay: 1s
      - script.execute: refresh_led_default

  - id: led_on_swipe_right
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          brightness: ${swipe_right_brightness}
          red: !lambda "return id(swipe_right_color)[0]/100.0;"
          green: !lambda "return id(swipe_right_color)[1]/100.0;"
          blue: !lambda "return id(swipe_right_color)[2]/100.0;"
      - delay: 1s
      - script.execute: refresh_led_default

  - id: led_on_full_touch
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          brightness: ${multi_touch_brightness}
          red: !lambda "return id(multi_touch_color)[0]/100.0;"
          green: !lambda "return id(multi_touch_color)[1]/100.0;"
          blue: !lambda "return id(multi_touch_color)[2]/100.0;"
          effect: ${multi_touch_effect}
      - delay: 1s
      - script.execute: refresh_led_default

  - id: led_on_long_touch
    mode: restart
    then:
      - light.turn_on:
          id: rgb_light
          brightness: ${long_press_brightness}
          red: !lambda "return id(long_press_color)[0]/100.0;"
          green: !lambda "return id(long_press_color)[1]/100.0;"
          blue: !lambda "return id(long_press_color)[2]/100.0;"
      - delay: 1s
      - script.execute: refresh_led_default
  # refresh_nightlight (automatizacion por sol) vive en common/nightlight_auto.yaml,
  # si esta importado. El switch "nightlight" (arriba, en switch:) se queda
  # siempre apagado si no lo importas, asi que el OR con nightlight_active en
  # refresh_led_default de channels_N.yaml sigue compilando y funcionando bien.
