# Variante de 3 canales

switch:
  - platform: gpio
    id: relay_1
    name: "${channel_1}"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_2
    name: "${channel_2}"
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    id: relay_3
    name: "${channel_3}"
    pin: ${relay_3_pin}
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: template
    id: touchfield_1
    name: "Boton ${channel_1}"
  - platform: template
    id: touchfield_2
    name: "Boton ${channel_2}"
  - platform: template
    id: touchfield_3
    name: "Boton ${channel_3}"

  - platform: template
    id: long_press_1
    name: "Long ${channel_1}"
  - platform: template
    id: long_press_2
    name: "Long ${channel_2}"
  - platform: template
    id: long_press_3
    name: "Long ${channel_3}"

script:
  # Cancela el long-press pendiente/activo cuando el gesto termina siendo un
  # swipe, un multi-touch, o el long-press GLOBAL (5s) del componente -- estos
  # 4 eventos NUNCA disparan on_release (el propio componente los desvia por
  # su cuenta), asi que sin esto long_press_watch sigue corriendo y termina
  # prendiendo el long_press_N del canal donde arranco el toque. Tambien
  # limpia el flash de touch/long-press que pudiera seguir activo (el swipe/
  # full-touch dispara su propio flash a continuacion de esto).
  - id: cancel_long_press
    mode: restart
    then:
      - script.stop: long_press_watch
      - script.stop: touch_flash_timeout
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - script.execute: restore_ambient_state
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - globals.set:
                id: long_press_fired
                value: "false"
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_2
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_3
                state: OFF
          else:
            - globals.set:
                id: long_press_fired
                value: "false"

  # Flash de touch_color sobre el segmento del canal tocado (ver "Segment
  # Flash" en base.yaml), durante ${touch_time}. Si el toque se vuelve
  # long-press, long_press_watch cancela el apagado y cambia el color; si se
  # suelta antes, handle_release no hace nada con esto y touch_flash_timeout
  # lo apaga solo al llegar a ${touch_time}.
  - id: led_on_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - if:
                condition:
                  lambda: "return id(touch_pos) <= 3;"
                then:
                  - globals.set:
                      id: flash_led_from
                      value: !lambda "return 0;"
                  - globals.set:
                      id: flash_led_to
                      value: !lambda "return 1;"
                  - globals.set:
                      id: flash_led_from2
                      value: !lambda "return 22;"
                  - globals.set:
                      id: flash_led_to2
                      value: !lambda "return 31;"
                else:
                  - if:
                      condition:
                        lambda: "return id(touch_pos) <= 7;"
                      then:
                        - globals.set:
                            id: flash_led_from
                            value: !lambda "return 2;"
                        - globals.set:
                            id: flash_led_to
                            value: !lambda "return 5;"
                        - globals.set:
                            id: flash_led_from2
                            value: !lambda "return 18;"
                        - globals.set:
                            id: flash_led_to2
                            value: !lambda "return 21;"
                      else:
                        - globals.set:
                            id: flash_led_from
                            value: !lambda "return 6;"
                        - globals.set:
                            id: flash_led_to
                            value: !lambda "return 17;"
                        - globals.set:
                            id: flash_led_from2
                            value: !lambda "return -1;"
            - globals.set:
                id: flash_use_long_press_color
                value: "false"
            - script.execute: save_ambient_state
            - light.turn_on:
                id: rgb_light
                effect: "None"
            - light.turn_on:
                id: rgb_light
                effect: "Segment Flash"
            - script.execute: touch_flash_timeout

  # Toque mantenido > ${long_press_time} en la posicion pos -> long_press_N ON
  # (si se suelta antes, on_release hace script.stop y esto nunca corre: toque corto).
  - id: long_press_watch
    mode: restart
    then:
      - delay: ${long_press_time}
      - globals.set:
          id: long_press_fired
          value: "true"
      - if:
          condition:
            lambda: "return id(touch_pos) <= 3;"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: ON
          else:
            - if:
                condition:
                  lambda: "return id(touch_pos) <= 7;"
                then:
                  - binary_sensor.template.publish:
                      id: long_press_2
                      state: ON
                else:
                  - binary_sensor.template.publish:
                      id: long_press_3
                      state: ON
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            # El segmento ya lo dejo puesto led_on_touch; solo cambia el
            # color y cancela el apagado automatico para que se mantenga
            # prendido hasta soltar.
            - script.stop: touch_flash_timeout
            - globals.set:
                id: flash_use_long_press_color
                value: "true"
      - switch.turn_on: vibra

  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            # Cierra el hold: apaga el long_press_N que quedo encendido y el flash.
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_2
                state: OFF
            - binary_sensor.template.publish:
                id: long_press_3
                state: OFF
            - if:
                condition:
                  lambda: "return ${visual_feedback};"
                then:
                  - script.execute: restore_ambient_state
          else:
            # Toque corto: publica el evento y, si esta habilitado, conmuta el rele.
            - if:
                condition:
                  lambda: "return pos <= 3;"
                then:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_1_on_touch};"
                      then:
                        - switch.toggle: relay_1
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: OFF
            - if:
                condition:
                  lambda: "return pos > 3 && pos <= 7;"
                then:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_2_on_touch};"
                      then:
                        - switch.toggle: relay_2
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: OFF
            - if:
                condition:
                  lambda: "return pos > 7;"
                then:
                  - if:
                      condition:
                        lambda: "return ${toggle_relay_3_on_touch};"
                      then:
                        - switch.toggle: relay_3
                  - binary_sensor.template.publish:
                      id: touchfield_3
                      state: ON
                  - delay: ${button_on_time}
                  - binary_sensor.template.publish:
                      id: touchfield_3
                      state: OFF
