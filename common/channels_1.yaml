# Variante de 1 canal.
# NOTA: no hay hardware de 1 canal para calibrar los LEDs, así que el canal usa
# la tira completa (0-31) como segmento del flash de touch/long-press.

switch:
  - platform: gpio
    id: relay_1
    name: "${channel_1}"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: template
    id: touchfield_1
    name: "Boton ${channel_1}"
  - platform: template
    id: long_press_1
    name: "Long ${channel_1}"

script:
  # Cancela el long-press pendiente/activo cuando el gesto termina siendo un
  # swipe, un multi-touch, o el long-press GLOBAL (5s) del componente -- estos
  # 4 eventos NUNCA disparan on_release (el propio componente los desvia por
  # su cuenta), asi que sin esto long_press_watch sigue corriendo y termina
  # prendiendo long_press_1 aunque el toque haya sido, por ejemplo, un swipe.
  # Tambien limpia el flash de touch/long-press que pudiera seguir activo.
  - id: cancel_long_press
    mode: restart
    then:
      - script.stop: long_press_watch
      - script.stop: touch_flash_timeout
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - script.execute: restore_ambient_state
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - globals.set:
                id: long_press_fired
                value: "false"
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
          else:
            - globals.set:
                id: long_press_fired
                value: "false"

  # Un solo boton: cualquier toque usa la tira completa como segmento.
  - id: led_on_touch
    mode: restart
    then:
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - globals.set:
                id: flash_led_from
                value: !lambda "return 0;"
            - globals.set:
                id: flash_led_to
                value: !lambda "return 31;"
            - globals.set:
                id: flash_led_from2
                value: !lambda "return -1;"
            - globals.set:
                id: flash_use_long_press_color
                value: "false"
            - script.execute: save_ambient_state
            - light.turn_on:
                id: rgb_light
                effect: "None"
            - light.turn_on:
                id: rgb_light
                effect: "Segment Flash"
            - script.execute: touch_flash_timeout

  # Un solo boton: cualquier toque mantenido pertenece al canal 1.
  - id: long_press_watch
    mode: restart
    then:
      - delay: ${long_press_time}
      - globals.set:
          id: long_press_fired
          value: "true"
      - binary_sensor.template.publish:
          id: long_press_1
          state: ON
      - if:
          condition:
            lambda: "return ${visual_feedback};"
          then:
            - script.stop: touch_flash_timeout
            - globals.set:
                id: flash_use_long_press_color
                value: "true"
      - switch.turn_on: vibra

  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - if:
          condition:
            lambda: "return id(long_press_fired);"
          then:
            - binary_sensor.template.publish:
                id: long_press_1
                state: OFF
            - if:
                condition:
                  lambda: "return ${visual_feedback};"
                then:
                  - script.execute: restore_ambient_state
          else:
            - if:
                condition:
                  lambda: "return ${toggle_relay_1_on_touch};"
                then:
                  - switch.toggle: relay_1
            - binary_sensor.template.publish:
                id: touchfield_1
                state: ON
            - delay: ${button_on_time}
            - binary_sensor.template.publish:
                id: touchfield_1
                state: OFF
