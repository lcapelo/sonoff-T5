# Orientacion horizontal (panel rotado 90 grados en SENTIDO HORARIO respecto
# al vertical). Un swipe nativo "left" del chip se percibe, en vertical, como
# un gesto hacia arriba (ver "Swipe Top" en orientation_vertical.yaml); al
# rotar el panel 90 grados en sentido horario, lo que se percibia como
# "arriba" pasa a percibirse como "derecha" -- por eso "Swipe Top" (vertical)
# se renombra aca "Swipe Right". Por la misma razon "Swipe Bottom" pasa a
# "Swipe Left".
substitutions:
  swipe_a_name: "Swipe Right"
  swipe_b_name: "Swipe Left"
